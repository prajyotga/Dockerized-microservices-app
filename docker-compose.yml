version: "3.9"

services:
  api-gateway:
    build: ./API-Gateway
    container_name: api-gateway
    ports:
      - "4000:4000"
    env_file:
      - ./API-Gateway/.env.docker
    depends_on:
      - auth-service
      - restaurant-service
      - menu-service
      - cart-service
      - order-service
      - payment-service

  auth-service:
    build: ./Auth-Service
    container_name: auth-service
    ports:
      - "5000:5000"
    env_file:
      - ./Auth-Service/.env.docker

  restaurant-service:
    build: ./Restaurant-Service
    container_name: restaurant-service
    ports:
      - "5001:5001"
    env_file:
      - ./Restaurant-Service/.env.docker

  menu-service:
    build: ./Menu-Service
    container_name: menu-service
    ports:
      - "5002:5002"
    env_file:
      - ./Menu-Service/.env.docker

  cart-service:
    build: ./Cart-Service
    container_name: cart-service
    ports:
      - "5004:5004"
    env_file:
      - ./Cart-Service/.env.docker

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "5005:5005"
    env_file:
      - ./order-service/.env.docker

  payment-service:
    build: ./Payment-Service
    container_name: payment-service
    ports:
      - "5006:5006"
    env_file:
      - ./Payment-Service/.env.docker